<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="t d">
<title id="t">Architecture of ai-traces-to-trusted-eval-set: staged pipeline with an answer key</title>
<desc id="d">Inside the Python package eval_set_builder, the generate stage writes the raw traces and the answer key to data/raw. The pipeline stages run in order: load reads the raw file and rejects bad lines, scrub removes personal data, dedup removes exact and near duplicates, and then two branches start from dedup. The sample stage draws 300 traces and writes guide v1, and label runs two passes through the Annotators port, simulated or a model, with kappa 0.584. The synthesize stage asks the TextModel port, recorded or Claude, for 100 accepted cases and labels them the same way. compare sets the real slice against the synthetic one, contamination checks few-shot and fine-tuning text with 0 overlaps, and freeze writes eval-set/v1 with cases, labels, hashes and lineage. In amber, a note says the greedy scrub pattern catches 89.0 percent against 98.1 percent for the fixed one.</desc>
