<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="830" viewBox="0 0 1200 830" role="img" aria-labelledby="t d">
<title id="t">One make run of ai-traces-to-trusted-eval-set in nine rows</title>
<desc id="d">Nine rows run top to bottom across five lanes: the eval-set CLI, Workspace, Answer key, Text model and Annotators. The run loads 1,010 lines and rejects 10, scrubs personal data with 259 of 264 planted values caught, deduplicates with a swept setting, samples 300 traces, labels twice with kappa 0.584, synthesizes 100 hard cases, compares the real and synthetic slices, then checks contamination and freezes eval set v1. In amber, row 2x: the greedy email pattern swallows the period and catches only 235 of 264, 89.0 percent. The run ends with 0 overlaps and 5 file hashes.</desc>
<style>
:root{--paper:#0d1117;--ink:#f5f4f8;--mute:#9a96ab;--accent:#6ec8ff;--good:#7ce0a1;--warn:#ffd166}
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:var(--ink)}
.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-size:36px}
.caption{font-size:16px;fill:var(--mute)}
.name{font-size:20px;font-weight:600}
.lane{font-size:17px;font-weight:600}
.sub{font-size:15px;fill:var(--mute)}
.label{font-size:15px}
.tag{font-size:15px;fill:var(--mute)}
.num{font-size:15px;font-weight:700;fill:var(--paper)}
.legend{font-size:14px;fill:var(--mute)}
.t-accent{fill:var(--accent)}
.t-good{fill:var(--good)}
.t-warn{fill:var(--warn)}
.t-ink{fill:var(--ink)}
.b{font-weight:600}
.paper{fill:var(--paper);stroke:var(--mute);stroke-opacity:.3}
.grid{fill:url(#grid)}
.boundary{fill:var(--mute);fill-opacity:.035;stroke:var(--mute);stroke-opacity:.7;stroke-dasharray:6 5}
.svc{fill:var(--accent);fill-opacity:.08;stroke:var(--accent);stroke-width:1.25}
.store{fill:var(--mute);fill-opacity:.1;stroke:var(--mute);stroke-width:1.25}
.rim{fill:none;stroke:var(--mute);stroke-width:1.25}
.actor{fill:none;stroke:var(--mute);stroke-width:1.25}
.slot{fill:var(--accent);fill-opacity:.14;stroke:var(--accent);stroke-width:1}
.note{fill:var(--warn);fill-opacity:.09;stroke:var(--warn);stroke-width:1}
.win{fill:var(--good);fill-opacity:.09;stroke:var(--good);stroke-width:1}
.hair{fill:none;stroke:var(--mute);stroke-opacity:.4;stroke-width:1}
.zone{fill:var(--accent);fill-opacity:.045;stroke:var(--accent);stroke-width:1.25;stroke-dasharray:6 5}
.stop{fill:none;stroke:var(--warn);stroke-width:4;stroke-linecap:round}
.mask{fill:var(--paper)}
.sync,.async,.read,.fail,.ok{fill:none}
.sync{stroke:var(--accent);stroke-width:1.75;marker-end:url(#a-sync)}
.async{stroke:var(--accent);stroke-width:1.75;stroke-dasharray:8 6;marker-end:url(#a-async)}
.read{stroke:var(--mute);stroke-width:1.75;stroke-linecap:round;stroke-dasharray:1 6;marker-end:url(#a-read)}
.fail{stroke:var(--warn);stroke-width:2;marker-end:url(#a-fail)}
.ok{stroke:var(--good);stroke-width:1.75;marker-end:url(#a-ok)}
.dot{fill:var(--accent)}
.dot-w{fill:var(--warn)}
.dot-g{fill:var(--good)}
.head-sync,.head-async{stroke:var(--accent)}
.head-sync{fill:var(--accent)}
.head-async,.head-read{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.head-read{stroke:var(--mute)}
.head-fail{fill:var(--warn)}
.head-ok{fill:var(--good)}
.gridline{fill:none;stroke:var(--mute);stroke-opacity:.09}
</style>
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path class="gridline" d="M40 0H0V40"/></pattern>
<marker id="a-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-sync" d="M0 0L10 5L0 10z"/></marker>
<marker id="a-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-async" d="M1 1L9 5L1 9"/></marker>
<marker id="a-read" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-read" d="M1 1L9 5L1 9"/></marker>
<marker id="a-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-fail" d="M0 0L10 5L0 10z"/></marker>
<marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-ok" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="paper" x="0.5" y="0.5" width="1199" height="829" rx="16"/>
<rect class="grid" x="1" y="1" width="1198" height="828" rx="16"/>
<text class="title" x="48" y="68">From raw traces to eval set v1</text>
<text class="caption" x="48" y="100">One make run. The amber row is the scrub trap: a greedy pattern that looks clean and catches 89.0%.</text>

<rect class="svc" x="410" y="128" width="120" height="48" rx="10"/>
<text class="lane" x="470" y="148" text-anchor="middle">eval-set</text>
<text class="lane" x="470" y="168" text-anchor="middle">CLI</text>
<rect class="svc" x="555" y="128" width="130" height="48" rx="10"/>
<text class="lane" x="620" y="158" text-anchor="middle">Workspace</text>
<rect class="svc" x="705" y="128" width="130" height="48" rx="10"/>
<text class="lane" x="770" y="158" text-anchor="middle">Answer key</text>
<rect class="svc" x="855" y="128" width="130" height="48" rx="10"/>
<text class="lane" x="920" y="158" text-anchor="middle">Text model</text>
<rect class="svc" x="1010" y="128" width="130" height="48" rx="10"/>
<text class="lane" x="1075" y="158" text-anchor="middle">Annotators</text>
<path class="hair" d="M470 176V752M620 176V752M770 176V432M920 176V624M1075 176V560"/>
<path class="hair" d="M66 216V728"/>

<circle class="dot" cx="66" cy="216" r="15"/><text class="num" x="66" y="221" text-anchor="middle">1</text>
<text class="label b t-ink" x="96" y="212">Load, reject by line number</text>
<text class="sub" x="96" y="232">1,010 lines: 1,000 in, 10 out</text>
<path class="sync" d="M470 216H620"/>
<text class="label t-accent" x="482" y="206">traces.jsonl</text>

<circle class="dot" cx="66" cy="280" r="15"/><text class="num" x="66" y="285" text-anchor="middle">2</text>
<text class="label b t-ink" x="96" y="276">Scrub personal data</text>
<text class="sub" x="96" y="296">259 of 264 planted values caught</text>
<path class="sync" d="M470 280H770"/>
<text class="label t-accent" x="632" y="270">259 of 264</text>

<circle class="dot-w" cx="66" cy="344" r="15"/><text class="num" x="66" y="349" text-anchor="middle">2x</text>
<text class="label b t-warn" x="96" y="340">Greedy email pattern</text>
<text class="sub" x="96" y="360">235 of 264: period swallowed</text>
<path class="fail" d="M470 344H770"/>
<text class="label t-warn" x="632" y="334">89.0% caught</text>

<circle class="dot" cx="66" cy="408" r="15"/><text class="num" x="66" y="413" text-anchor="middle">3</text>
<text class="label b t-ink" x="96" y="404">Deduplicate, sweep the settings</text>
<text class="sub" x="96" y="424">size 2, 0.7, digit guard on</text>
<path class="sync" d="M470 408H770"/>
<text class="label t-accent" x="632" y="398">24-row sweep</text>

<circle class="dot" cx="66" cy="472" r="15"/><text class="num" x="66" y="477" text-anchor="middle">4</text>
<text class="label b t-ink" x="96" y="468">Sample 300, write guide v1</text>
<text class="sub" x="96" y="488">round-robin over intent cells</text>
<path class="sync" d="M470 472H620"/>
<text class="label t-accent" x="482" y="462">sample.jsonl</text>

<circle class="dot" cx="66" cy="536" r="15"/><text class="num" x="66" y="541" text-anchor="middle">5</text>
<text class="label b t-ink" x="96" y="532">Label twice, adjudicate</text>
<text class="sub" x="96" y="552">kappa 0.584, 75 disagreements</text>
<path class="sync" d="M470 536H1075"/>
<text class="label t-accent" x="932" y="526">two passes</text>

<circle class="dot" cx="66" cy="600" r="15"/><text class="num" x="66" y="605" text-anchor="middle">6</text>
<text class="label b t-ink" x="96" y="596">Synthesize 100 hard cases</text>
<text class="sub" x="96" y="616">111 calls, 11 rejected by rules</text>
<path class="sync" d="M470 600H920"/>
<text class="label t-accent" x="782" y="590">complete(seed)</text>

<circle class="dot" cx="66" cy="664" r="15"/><text class="num" x="66" y="669" text-anchor="middle">7</text>
<text class="label b t-ink" x="96" y="660">Compare real and synthetic</text>
<text class="sub" x="96" y="680">pass rate 64.3% vs 22.0%</text>
<rect class="slot" x="464" y="646" width="12" height="36" rx="4"/>
<text class="label t-accent" x="486" y="669">compare()</text>

<circle class="dot-g" cx="66" cy="728" r="15"/><text class="num" x="66" y="733" text-anchor="middle">8</text>
<text class="label b t-ink" x="96" y="724">Check contamination, freeze</text>
<text class="sub" x="96" y="744">0 overlaps, manifest of hashes</text>
<path class="sync" d="M470 728H620"/>
<text class="label t-accent" x="482" y="718">eval-set/v1</text>
<rect class="win" x="650" y="708" width="340" height="40" rx="10"/>
<text class="label b t-good" x="666" y="733">frozen: 0 overlaps, 5 file hashes</text>

<path class="sync" d="M48 786H112"/><text class="legend" x="124" y="791">sync call</text>
<path class="fail" d="M696 786H760"/><text class="legend" x="772" y="791">failure path</text>
</svg>
